name: Build Spec Generator (Windows exe)

on:
  push:
    branches: ["**"]
    paths:
      - "spec-generator/**"
      - ".github/workflows/spec-generator-build.yml"
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      # Windows 콘솔 기본 코덱에서 한글 출력이 깨지지 않도록
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        working-directory: spec-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 호환성 자체 점검 (예전 문서가 계속 열리는지)
        run: python -m spec_generator selftest

      - name: Smoke test (render the sample without a GUI)
        run: python -m spec_generator build "samples/예제_리액터_475A.spec.json" -o build-check.pdf

      - name: 판 번호 읽기
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import spec_generator; print(spec_generator.__version__)')" >> $GITHUB_OUTPUT

      - name: Build exe
        run: python -m PyInstaller --clean --noconfirm SpecGenerator.spec

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SpecGenerator-v${{ steps.ver.outputs.v }}-exe
          path: spec-generator/dist/SpecGenerator.exe
          if-no-files-found: error
