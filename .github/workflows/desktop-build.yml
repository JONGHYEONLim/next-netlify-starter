name: Build Desktop App

# 동작:
#  - desktop/ 코드를 브랜치에 push 하거나 Actions 탭에서 수동 실행하면
#    윈도우 설치파일(.exe)을 만들어 GitHub "Releases"에 공개로 올립니다.
#    → 로그인 없이 누구나 받을 수 있는 다운로드 링크가 생기고, 자동 업데이트도 동작합니다.
#  - Actions Artifact 로도 함께 올립니다(백업).
on:
  push:
    branches:
      - claude/quotation-generator-program-jz3pl1
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Releases 에 게시(.exe + latest.yml 자동 업데이트 메타 포함)
      - name: Build & publish installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 릴리스를 공개(draft 해제) → 로그인 없이 다운로드 가능 + 자동 업데이트 인식
      - name: Publish the release (un-draft)
        shell: pwsh
        run: |
          $ver = "v$(node -p "require('./package.json').version")"
          Write-Host "Publishing release $ver"
          gh release edit $ver --draft=false --latest --repo $env:GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Actions Artifact 로도 백업 업로드
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRAUMM-Office-installer
          path: desktop/dist/*.exe
          if-no-files-found: error
