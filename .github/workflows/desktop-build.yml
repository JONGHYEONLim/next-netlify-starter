name: Build Desktop App

# 태그(v1.0.0 등)를 올리거나, Actions 탭에서 수동 실행하면
# 윈도우 설치파일(.exe)을 만들어 Releases에 게시합니다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build & publish installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 자동 업데이트가 인식하도록 릴리스를 공개(draft 해제)합니다.
      - name: Publish the release (un-draft)
        shell: pwsh
        run: |
          $ver = "v$(node -p "require('./package.json').version")"
          Write-Host "Publishing release $ver"
          gh release edit $ver --draft=false --repo $env:GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
