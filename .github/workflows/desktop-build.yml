name: Build Desktop App

# 동작:
#  - desktop/ 코드를 브랜치에 push 하거나 Actions 탭에서 수동 실행하면
#    윈도우 설치파일(.exe)을 만들어 "Actions 실행 결과의 Artifact"로 올립니다. (바로 내려받아 설치 가능)
#  - v1.0.1 같은 태그를 push 하면 추가로 Releases 에 게시하고 자동 업데이트가 동작합니다.
on:
  push:
    branches:
      - claude/quotation-generator-program-jz3pl1
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 태그에서 실행될 때만 Releases 에 게시(onTag), 평소엔 빌드만
      - name: Build installer
        run: npx electron-builder --win --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRAUMM-Office-installer
          path: desktop/dist/*.exe
          if-no-files-found: error

      # 태그 빌드일 때만 릴리스를 공개(draft 해제) → 자동 업데이트 인식
      - name: Publish the release (un-draft)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "v$(node -p "require('./package.json').version")"
          Write-Host "Publishing release $ver"
          gh release edit $ver --draft=false --repo $env:GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
