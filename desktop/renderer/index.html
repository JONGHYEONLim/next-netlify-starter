<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BRAUMM 사무 도구 · 견적/명세/성적</title>
<style>
  :root {
    --accent:#F5A623; --accent-deep:#D98A0B; --bg:#eceae6; --panel:#fff; --panel-2:#f7f6f3;
    --line:#e2ded7; --text:#26241f; --muted:#837c70; --danger:#c0392b; --danger-bg:#fdecea;
    --ok:#1a8a5a; --topbar:#1c1b18; --topbar-text:#f4f1ea; --radius:9px;
    --shadow:0 1px 3px rgba(0,0,0,.09),0 6px 20px rgba(0,0,0,.05);
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#17171a;--panel:#222226;--panel-2:#1b1b1e;--line:#34343a;--text:#e7e5e1;--muted:#9a958c;--topbar:#0e0e10;--danger-bg:#3a1d1a;--shadow:0 1px 3px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35);}}
  :root[data-theme="light"]{--bg:#eceae6;--panel:#fff;--panel-2:#f7f6f3;--line:#e2ded7;--text:#26241f;--muted:#837c70;--topbar:#1c1b18;--danger-bg:#fdecea;--shadow:0 1px 3px rgba(0,0,0,.09),0 6px 20px rgba(0,0,0,.05);}
  :root[data-theme="dark"]{--bg:#17171a;--panel:#222226;--panel-2:#1b1b1e;--line:#34343a;--text:#e7e5e1;--muted:#9a958c;--topbar:#0e0e10;--danger-bg:#3a1d1a;--shadow:0 1px 3px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35);}
  *{box-sizing:border-box;} body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);}
  button{font-family:inherit;}

  .topbar{position:sticky;top:0;z-index:30;background:var(--topbar);color:var(--topbar-text);}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;}
  .brand img{height:22px;}
  .tabs{display:flex;gap:2px;padding:0 12px;flex-wrap:wrap;}
  .tab{border:0;background:transparent;color:#bdb8ac;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;}
  .tab:hover{color:#fff;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .btn{border:0;border-radius:7px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;background:#34332e;color:#f4f1ea;transition:background .12s;}
  .btn:hover{background:#45443d;} .btn.primary{background:var(--accent);color:#241a05;} .btn.primary:hover{background:var(--accent-deep);}
  .btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .dot{color:#ffcf6b;font-weight:800;margin-left:3px;}

  .layout{display:grid;grid-template-columns:410px 1fr;gap:18px;padding:18px;align-items:start;}
  @media (max-width:1120px){.layout{grid-template-columns:1fr;}}
  .single{padding:18px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:104px;max-height:calc(100vh-122px);overflow-y:auto;}
  @media (max-width:1120px){.panel{position:static;max-height:none;}}
  .panel-inner{padding:16px;}

  .status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:9px 11px;margin-bottom:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;}
  .status b{color:var(--accent-deep);}
  .badge{font-weight:700;} .badge.dirty{color:var(--danger);} .badge.saved{color:var(--ok);}

  .sec{margin-bottom:20px;}
  .sec>h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;justify-content:space-between;}

  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,166,35,.18);}
  .field textarea{resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;} .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .hint{font-size:11px;color:var(--muted);margin:6px 0 0;line-height:1.5;}
  .item{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--panel-2);}
  .item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;} .item-head span{font-size:12px;font-weight:700;}
  .rm{border:0;background:var(--danger-bg);color:var(--danger);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600;}
  .item-calc{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums;} .item-calc b{color:var(--text);}
  .add{width:100%;border:1.5px dashed var(--accent);background:rgba(245,166,35,.09);color:var(--accent-deep);border-radius:8px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;} .add:hover{background:rgba(245,166,35,.16);}
  .fixed-box{position:relative;background:var(--panel-2);border:1px dashed var(--line);border-radius:7px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.7;}
  .fixed-tag{position:absolute;top:8px;right:10px;font-size:10px;color:var(--muted);}
  .logo-row{display:flex;align-items:center;gap:12px;} .logo-prev{width:118px;height:52px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;flex-shrink:0;}
  .logo-prev img{max-width:100%;max-height:100%;object-fit:contain;} .logo-empty{font-size:11px;color:var(--muted);}
  .btn-sm{border:0;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#241a05;} .btn-sm:hover{background:var(--accent-deep);}
  .btn-sm.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);} .btn-sm.ghost:hover{background:var(--line);}
  .logo-btns{display:flex;flex-direction:column;gap:6px;}

  /* Sheets */
  .preview-wrap{display:flex;justify-content:center;}
  .sheet{background:#fff;color:#000;width:210mm;min-height:297mm;padding:14mm 12mm;box-shadow:0 2px 12px rgba(0,0,0,.18);font-size:11px;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .sheet-logo{margin-bottom:4px;} .sheet-logo img{max-height:44px;max-width:250px;object-fit:contain;}
  .doc-title{text-align:center;font-size:30px;font-weight:800;letter-spacing:15px;margin:0 0 3px;padding-left:15px;}
  .doc-serial{text-align:right;font-size:10px;color:#333;margin-bottom:10px;}
  .head-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .meta{width:100%;border-collapse:collapse;} .meta th,.meta td{border:1px solid #333;padding:4px 6px;font-size:10.5px;text-align:left;vertical-align:middle;}
  .meta th{background:#f1efe9;width:35%;font-weight:700;white-space:nowrap;} .meta.sup th{background:#fbf1dd;}
  .stamp{color:#c1121f;border:1px solid #c1121f;border-radius:50%;padding:1px 3px;font-size:9px;margin-left:4px;}
  .greeting{margin:8px 0;font-size:10.5px;line-height:1.6;}
  .amount{border:2px solid #111;padding:8px 10px;margin:8px 0 12px;display:flex;align-items:center;justify-content:space-between;font-weight:700;gap:10px;}
  .amount .krw{font-size:15px;} .amount .num{font-size:13px;font-variant-numeric:tabular-nums;} .amount .vat{font-size:10px;font-weight:600;color:#444;}
  .items{width:100%;border-collapse:collapse;margin-bottom:10px;} .items th,.items td{border:1px solid #333;padding:5px 6px;font-size:10px;vertical-align:middle;}
  .items thead th{background:#e7e3da;text-align:center;font-weight:700;} .items td.n{text-align:right;font-variant-numeric:tabular-nums;} .items td.c{text-align:center;}
  .items .nm{font-weight:600;} .items .sp{color:#333;font-size:9.5px;} .items tfoot td{background:#f1efe9;font-weight:800;}
  .foot{font-size:9.5px;line-height:1.6;color:#222;margin-top:8px;white-space:pre-wrap;} .empty-items{text-align:center;color:#999;padding:16px;}

  /* Cert (성적서) sheet */
  .cert{background:#fff;color:#000;width:277mm;min-height:190mm;padding:10mm;box-shadow:0 2px 12px rgba(0,0,0,.18);font-size:10px;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .cert-title{display:inline-block;border:1.5px solid #111;padding:4px 12px;font-size:15px;font-weight:800;margin-bottom:8px;}
  .cert table{width:100%;border-collapse:collapse;} .cert th,.cert td{border:1px solid #444;padding:3px 5px;font-size:9.5px;vertical-align:middle;}
  .cert .lbl{background:#eef2f7;font-weight:700;white-space:nowrap;}
  .cert .yellow{background:#f2f31a;font-weight:700;}
  .cert .grn{background:#7ac043;font-weight:800;color:#123;}
  .cert .num{text-align:center;font-variant-numeric:tabular-nums;} .cert .cc{text-align:center;}
  .cert .stampcell{height:34px;text-align:center;} .cert .stampcell img{max-height:30px;}
  .cert .draw{height:150px;text-align:center;} .cert .draw img{max-height:150px;max-width:100%;}
  .cert-foot{text-align:right;font-weight:700;margin-top:6px;}

  /* Cards / lists */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .list{width:100%;border-collapse:collapse;font-size:13px;} .list th,.list td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:middle;}
  .list thead th{color:var(--muted);font-size:12px;border-bottom:2px solid var(--line);} .list td.n{text-align:right;font-variant-numeric:tabular-nums;}
  .list tr.active{background:rgba(245,166,35,.12);}
  .chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .chip.s0{background:#e5e7eb;color:#374151;} .chip.s1{background:#dbeafe;color:#1e40af;} .chip.s2{background:#fef3c7;color:#92400e;} .chip.s3{background:#dcfce7;color:#166534;} .chip.s4{background:#fde68a;color:#78350f;} .chip.s5{background:#e9d5ff;color:#6b21a8;}
  .mini{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;font-weight:600;color:var(--text);} .mini:hover{background:var(--panel-2);}
  .mini.del{color:var(--danger);border-color:var(--danger);} .mini.go{background:var(--accent);color:#241a05;border-color:var(--accent);}
  .rowacts{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;}
  .empty{text-align:center;color:var(--muted);padding:30px;}
  .h1{font-size:18px;margin:0 0 12px;} .sub{color:var(--muted);font-size:13px;margin:0 0 16px;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .overlay[hidden]{display:none;} .modal{background:var(--panel);color:var(--text);border-radius:12px;width:100%;max-width:900px;padding:20px;box-shadow:var(--shadow);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;} .modal-head h2{margin:0;font-size:18px;}

  [hidden]{display:none !important;}
  @media print{.topbar,.panel,.overlay,.no-print,.toolbar{display:none!important;}body{background:#fff;}.layout,.single{display:block;padding:0;}.preview-wrap{display:block;}.sheet,.cert{width:auto;min-height:auto;box-shadow:none;padding:0;}}
  @page{size:A4;margin:12mm;}
  .toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand" id="brand"></div>

<div id="app"></div>

<div class="overlay" id="overlay" hidden><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn" id="modalClose">닫기</button></div><div id="modalBody"></div></div></div>

<input type="file" accept="application/json" id="restorePick" hidden>

<script>
(function(){
"use strict";
var VAT=0.1;
var K={quotes:"braumm-quotes-v3",products:"braumm-products-v3",certs:"braumm-certs-v3",statements:"braumm-statements-v3",settings:"braumm-settings-v3",draft:"braumm-draft-v3",history:"braumm-mailhistory-v3"};
var SUP={bizNo:"216-87-04048",company:"(주)브라움",ceo:"임종현",address:"경기도 부천시 오정구 석천로397 부천테크노파크 쌍용3차 101동 406",bizType:"제조",bizItem:"전자코일 기타 유도자"};
var DLOGO='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120"><path fill="#F5A623" d="M40 12 h44 a26 26 0 0 1 26 26 a22 22 0 0 1 -14 20 a24 24 0 0 1 16 23 a26 26 0 0 1 -26 27 H36 z"/><path fill="#fff" d="M50 34 l40 0 l-14 18 l-40 0 z"/><path fill="#fff" d="M62 66 l40 0 l-14 18 l-40 0 z"/><text x="150" y="82" font-family="Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="2" fill="#111">BRAUMM</text></svg>');

  supEnCompany:"BRAUMM Co., Ltd.",supEnCeo:"Jonghyeon Lim",supEnAddress:"#406, 101-dong, Ssangyong 3rd, Bucheon Technopark, 397 Seokcheon-ro, Ojeong-gu, Bucheon-si, Gyeonggi-do, Republic of Korea",supEnType:"Manufacturing / Electronic Coils & Inductors",
  bodyQuote:"안녕하세요.\n(주)브라움입니다.\n요청하신 견적서를 첨부와 같이 송부드립니다.\n검토 후 회신 부탁드립니다.\n감사합니다.",
  bodyStatement:"안녕하세요.\n(주)브라움입니다.\n거래명세서를 첨부와 같이 송부드립니다.\n확인 부탁드립니다.\n감사합니다.",

// 표준 안내문구: 각 줄을 견적서마다 켜고 끌 수 있음 (양산 시 3번째 줄 해제)
var STD_NOTES=[
  "*상기 견적가는 수량(MOQ) 및 사양에 따라 다소 변경될 수 있습니다.",
  "상기 견적은 운송비를 포함한 금액입니다.",
  "상기 견적은 샘플 제작 기준으로 산정되었으며, 양산 시 단가가 변경될 수 있습니다."
];
var STD_NOTES_EN=[
  "*The quoted prices may vary depending on quantity (MOQ) and specifications.",
  "The quotation includes shipping cost.",
  "The quotation is based on sample production; unit prices may change for mass production."
];
function defaultNoteFlags(){return STD_NOTES.map(function(){return true;});}
function buildNotesHtml(q,lang){
  var src=lang==="en"?STD_NOTES_EN:STD_NOTES;
  var etcLabel=lang==="en"?"Note: ":"기타: ";
  var flags=(q.noteFlags&&q.noteFlags.length===src.length)?q.noteFlags:defaultNoteFlags();
  var on=src.filter(function(_,i){return flags[i];});
  var lines=[];
  if(on.length){
    lines.push(on[0]);
    var etc=on.slice(1);
    for(var i=0;i<etc.length;i++){lines.push((i===0?etcLabel:"")+(i+1)+". "+etc[i]);}
  }
  return lines.length?'<div class="foot">'+esc(lines.join("\n"))+'</div>':'';
}
var STATUS=["견적","발주접수","제작중","제작완료","세금계산서발행","거래명세서발행"];

// ---- korean number ----
var _D=["","일","이","삼","사","오","육","칠","팔","구"],_S=["","십","백","천"],_B=["","만","억","조","경"];
function four(n){var s=String(n).padStart(4,"0"),r="";for(var i=0;i<4;i++){var d=+s[i];if(d)r+=_D[d]+_S[3-i];}return r;}
function numKo(n){var v=Math.floor(Math.abs(Number(n)||0));if(v===0)return"영";var g=[],x=v;while(x>0){g.push(x%10000);x=Math.floor(x/10000);}var r="";for(var i=g.length-1;i>=0;i--){if(g[i])r+=four(g[i])+_B[i];}return r;}
function won(n){return numKo(n)+" 원 정";}
function fmt(n){return(Number(n)||0).toLocaleString("en-US");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

// ---- storage ----
function rd(k,f){try{var r=localStorage.getItem(k);return r?JSON.parse(r):f;}catch(e){return f;}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function id(p){return(p||"x")+"_"+Date.now().toString(36)+"_"+Math.floor(Math.random()*1e6).toString(36);}
function todayISO(){var d=new Date(),p=function(n){return String(n).padStart(2,"0");};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function ymd6(iso){var s=(iso||todayISO()).replace(/-/g,"");return s.slice(2);} // YYMMDD
function fmtTime(ts){if(!ts)return"";var d=new Date(ts),p=function(n){return String(n).padStart(2,"0");};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function clone(o){return JSON.parse(JSON.stringify(o));}
function safeName(s){return String(s==null||s===""?"무제":s).replace(/[\\/:*?"<>|\n\r\t]/g," ").replace(/\s+/g," ").trim();}
// 인쇄/PDF 저장 시 파일명을 '날짜_종류_업체명' 으로 자동 지정 (브라우저·Electron 모두 document.title 을 기본 파일명으로 사용)
function printDoc(datePart,kind,who){
  var prev=document.title;
  document.title=safeName(datePart)+"_"+kind+"_"+safeName(who);
  var restore=function(){document.title=prev;window.removeEventListener("afterprint",restore);};
  window.addEventListener("afterprint",restore);
  setTimeout(function(){window.print();},30);
}

// ---- state ----
var settings=Object.assign({},DSET,rd(K.settings,{}));
var quotes=rd(K.quotes,[]),products=rd(K.products,[]),certs=rd(K.certs,[]),statements=rd(K.statements,[]);
var mailHistory=rd(K.history,[]);
var draft=rd(K.draft,null);
var view="quote";
var pickCb=null;
var isDesktop=!!(typeof window!=="undefined"&&window.braumm&&window.braumm.isDesktop);
var $=function(id){return document.getElementById(id);};

function pickImage(cb){pickCb=cb;$("filePick").click();}

function saveAll(){wr(K.quotes,quotes);wr(K.products,products);wr(K.certs,certs);wr(K.statements,statements);wr(K.settings,settings);}

// =========================================================== QUOTE
function emptyItem(){return{name:"",spec:"",qty:1,unit:"EA",price:0,usdPrice:0,remark:""};}
function newQuote(){return{id:id("q"),date:todayISO(),seq:null,status:0,taxDate:"",discountRate:0,vatRate:10,lang:"ko",fxRate:"",fxDate:todayISO(),usdManual:false,recipient:"",attn:"",recipientTel:"",recipientFax:"",recipientEmail:"",payment:"선급",validity:"1개월",items:[emptyItem()],extraNotes:"",noteFlags:defaultNoteFlags(),manager:(settings.managerKo||settings.manager),companyTel:settings.companyTel,savedAt:null};}
function fmtUSD(krw,rate){var r=Number(rate)||0;if(r<=0)return "-";return "$"+Math.round(krw/r).toLocaleString("en-US");}
function usdWhole(v){return "$"+Math.round(Number(v)||0).toLocaleString("en-US");}
function vatRateOf(q){return q&&q.vatRate!=null?Number(q.vatRate):10;}
// 견적 금액 계산 (정가 → 할인 → 공급가액 → 부가세 → 합계)
function quoteCalc(q){
  var items=(q&&q.items)||[];
  var listSupply=items.reduce(function(a,it){return a+(Number(it.qty)||0)*(Number(it.price)||0);},0);
  var rate=Number(q&&q.discountRate)||0;
  var discount=Math.round(listSupply*rate/100);
  var netSupply=listSupply-discount;
  var vr=vatRateOf(q);
  var vat=Math.round(netSupply*vr/100);
  var total=netSupply+vat;
  return {listSupply:listSupply,rate:rate,discount:discount,netSupply:netSupply,vat:vat,total:total,vatRate:vr};
}
// USD 직접 입력 모드용 계산 (달러 네이티브, 반올림)
function quoteCalcUSD(q){
  var items=(q&&q.items)||[];
  var listSupply=items.reduce(function(a,it){return a+(Number(it.qty)||0)*(Number(it.usdPrice)||0);},0);
  var rate=Number(q&&q.discountRate)||0;
  var discount=Math.round(listSupply*rate/100);
  var netSupply=listSupply-discount;
  var vr=vatRateOf(q);
  var vat=Math.round(netSupply*vr/100);
  var total=netSupply+vat;
  return {listSupply:listSupply,rate:rate,discount:discount,netSupply:netSupply,vat:vat,total:total,vatRate:vr};
}
var quote=(draft&&draft.id&&draft.items)?draft:newQuote();
var qdirty=false;
function nextQSeq(date,qid){return 1+quotes.filter(function(q){return q.date===date&&q.id!==qid;}).length;}
function qserial(date,seq){return String(date).replace(/-/g,"/")+"-"+seq;}
function qrows(){var vr=vatRateOf(quote);return quote.items.map(function(it){var q=Number(it.qty)||0,p=Number(it.price)||0,s=q*p;return{name:it.name,spec:it.spec,qty:q,unit:it.unit,price:p,usdPrice:Number(it.usdPrice)||0,remark:it.remark,supply:s,vat:Math.round(s*vr/100)};});}
function quoteTotal(q){return quoteCalc(q).total;}

function bindMailSettings(){
  if(!isDesktop)return;
  var st=$("mailPwState");
  if(st&&window.braumm)window.braumm.hasMailPassword().then(function(has){st.textContent=has?"· 저장됨 ✓":"· 미저장";});
  var save=$("mailPwSave");
  if(save)save.onclick=function(){
    var v=$("mailPwInput").value.replace(/\s/g,"");
    if(!v){alert("앱 비밀번호를 입력하세요.");return;}
    window.braumm.saveMailPassword(v).then(function(r){
      if(r&&r.ok){$("mailPwInput").value="";if(st)st.textContent="· 저장됨 ✓";alert("앱 비밀번호를 안전하게 저장했습니다.");}
      else alert("저장 실패: "+((r&&r.error)||"알 수 없음"));
    });
  };
  var bcc=$("mailBcc");
  if(bcc)bcc.onchange=function(){settings.mailBcc=bcc.checked;wr(K.settings,settings);};
}

    var f=manual?usdWhole:function(v){return fmtUSD(v,rate);};
    var listS=manual?cU.listSupply:ts, listVat=Math.round(listS*vr/100);
    var amountStr=manual?usdWhole(cU.total):fmtUSD(g,rate);
    var rateNote=manual
      ?('Amounts entered directly in USD.'+(Number(rate)>0?' (Reference exchange rate: USD 1 = KRW '+fmt(rate)+', as of '+esc(quote.fxDate||"-")+')':''))
      :((Number(rate)>0)?'Applied exchange rate: USD 1 = KRW '+fmt(rate)+' (as of '+esc(quote.fxDate||"-")+')':'<span style="color:#c1121f">⚠ Please enter the exchange rate. (환율을 입력하세요)</span>');

function currentDocInfo(kind){
  if(kind==="statement"&&curStatement){var s=curStatement;return{kind:"거래명세서",to:"",who:s.recipient,date:s.date,subject:"[거래명세서] "+SUP.company+" - "+String(s.date).replace(/-/g,"/")+" -"+s.seq,body:settings.bodyStatement};}
  if(kind==="cert"){var pp=products.find(function(x){return x.id===cert.productId;})||{};return{kind:"성적서",to:"",who:pp.name||"제품",date:cert.date,subject:"[시험성적서] "+SUP.company+" - "+(cert.serial||"")+" "+(pp.name||""),body:settings.bodyCert};}
  var seq=quote.seq!=null?quote.seq:nextQSeq(quote.date,quote.id);
  return{kind:"견적서",to:quote.recipientEmail||"",who:quote.recipient,date:quote.date,subject:"[견적서] "+SUP.company+" - "+qserial(quote.date,seq),body:settings.bodyQuote};
}
function openMailDialog(kind){
  if(!isDesktop){alert("이메일 직접 발송은 데스크톱 앱에서만 가능합니다.");return;}
  var d=currentDocInfo(kind);
  var fname=safeName(d.date)+"_"+d.kind+"_"+safeName(d.who);
  $("modalTitle").textContent="✉ 이메일 보내기 · "+d.kind;
  $("modalBody").innerHTML='<div id="mailWarn"></div>'+
    '<div class="field"><label>받는 사람 (이메일)</label><input type="email" id="mTo" value="'+esc(d.to)+'" placeholder="buyer@company.com"></div>'+
    '<div class="field"><label>제목</label><input id="mSubject" value="'+esc(d.subject)+'"></div>'+
    '<div class="field"><label>본문</label><textarea id="mBody" rows="7">'+esc(d.body||"")+'</textarea></div>'+
    '<div class="fixed-box">📎 첨부: <b>'+esc(fname)+'.pdf</b> (현재 화면의 '+esc(d.kind)+'가 PDF로 자동 첨부됩니다)</div>'+
    '<div class="toolbar" style="margin-top:14px"><button class="btn" id="mCancel">취소</button><button class="btn primary" id="mSend">보내기</button></div>';
  $("overlay").hidden=false;
  window.braumm.hasMailPassword().then(function(has){if(!has)$("mailWarn").innerHTML='<div class="fixed-box" style="border-color:var(--danger);color:var(--danger);margin-bottom:10px">⚠ Gmail 앱 비밀번호가 저장되어 있지 않습니다. 견적서 탭 → [이메일 설정]에서 먼저 저장하세요.</div>';});
  $("mCancel").onclick=function(){$("overlay").hidden=true;};
  $("mSend").onclick=function(){
    var to=$("mTo").value.trim();
    if(!to){alert("받는 사람 이메일을 입력하세요.");return;}
    var payload={from:settings.mailFrom,fromName:settings.mailFromName,to:to,bcc:settings.mailBcc?settings.mailFrom:"",subject:$("mSubject").value,body:$("mBody").value,filename:fname};
    var btn=$("mSend");btn.textContent="보내는 중…";btn.disabled=true;
    window.braumm.sendMail(payload).then(function(r){
      if(r&&r.ok){
        mailHistory.unshift({kind:d.kind,to:to,subject:payload.subject,at:Date.now(),ok:true});
        wr(K.history,mailHistory);
        $("overlay").hidden=true;
        alert("메일을 보냈습니다. → "+to);
      }else{
        mailHistory.unshift({kind:d.kind,to:to,subject:payload.subject,at:Date.now(),ok:false,error:(r&&r.error)||""});
        wr(K.history,mailHistory);
        btn.textContent="보내기";btn.disabled=false;
        alert("발송 실패: "+((r&&r.error)||"알 수 없는 오류")+"\n\n앱 비밀번호/인터넷 연결을 확인하세요.");
      }
    });
  };
}
function openMailHistory(){
  $("modalTitle").textContent="📮 발송 이력 ("+mailHistory.length+")";
  $("modalBody").innerHTML=mailHistory.length===0?'<p class="empty">발송 이력이 없습니다.</p>':
    '<table class="list"><thead><tr><th>보낸시각</th><th>종류</th><th>받는사람</th><th>제목</th><th>결과</th></tr></thead><tbody>'+
    mailHistory.slice(0,100).map(function(h){return '<tr><td>'+esc(fmtTime(h.at))+'</td><td>'+esc(h.kind)+'</td><td>'+esc(h.to)+'</td><td style="font-size:12px">'+esc(h.subject)+'</td><td>'+(h.ok?'<span class="chip s3">성공</span>':'<span class="chip s0" title="'+esc(h.error||"")+'">실패</span>')+'</td></tr>';}).join("")+'</tbody></table>';
  $("overlay").hidden=false;
}
$("restorePick").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(d.quotes)quotes=d.quotes;if(d.products)products=d.products;if(d.certs)certs=d.certs;if(d.statements)statements=d.statements;if(d.settings)settings=Object.assign(settings,d.settings);saveAll();alert("백업을 불러왔습니다.");route();}catch(err){alert("올바른 백업 파일이 아닙니다.");}};r.readAsText(f);e.target.value="";});

function bindLogo(prevId,upId,rmId){renderBrand();var p=$(prevId);if(p)p.innerHTML=settings.logo?'<img src="'+esc(settings.logo)+'">':'<span class="logo-empty">로고 없음</span>';var u=$(upId);if(u)u.onclick=function(){pickImage(function(d){settings.logo=d;wr(K.settings,settings);route();});};var r=$(rmId);if(r)r.onclick=function(){settings.logo=DLOGO;wr(K.settings,settings);route();};}
function renderBrand(){$("brand").innerHTML=(settings.logo?'<img src="'+esc(settings.logo)+'">':'BRAUMM')+'<span>사무 도구</span>';}

function route(){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t.dataset.view===view);});
  if(view==="quote")renderQuote();
  else if(view==="statement")renderStatementView();
  else if(view==="cert")renderCertView();
  else if(view==="product")renderProductView();
  else if(view==="sales")renderSalesView();
  setGlobalActions();renderBrand();
}

// ---- global event delegation ----
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){view=t.dataset.view;curStatement=null;route();});});
$("modalClose").onclick=function(){$("overlay").hidden=true;};
$("overlay").addEventListener("click",function(e){if(e.target===$("overlay"))$("overlay").hidden=true;});
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("overlay").hidden=true;});

document.addEventListener("input",function(e){
  var t=e.target,d=t.dataset;
  if(d.q!==undefined){quote[d.q]=t.value;if(d.q==="date")quote.seq=null;markQ();qsheet();}
  else if(d.set!==undefined){settings[d.set]=t.value;quote[d.set]=t.value;wr(K.settings,settings);markQ();qsheet();}
  else if(d.qi!==undefined){quote.items[+d.qi][d.k]=t.value;markQ();updateQCalc();qsheet();}
  else if(d.c!==undefined){if(d.c==="productId"){cert.productId=t.value;var p=products.find(function(x){return x.id===t.value;});if(p&&p.ambient)cert.ambient=cert.ambient||p.ambient;markC();renderCertView();return;}cert[d.c]=t.value;if(d.c==="date")cert.serialSeq=null;markC();csheet();var cs=$("cserial");}
  else if(d.cdc!==undefined){cert.mDcR[+d.cdc]=t.value;markC();csheet();}
});
document.addEventListener("click",function(e){
  var t=e.target,d=t.dataset,b;
  if(d.qrm!==undefined){quote.items.splice(+d.qrm,1);if(!quote.items.length)quote.items.push(emptyItem());markQ();renderQItems();qsheet();}
  if(t.id==="qadd"){quote.items.push(emptyItem());markQ();renderQItems();qsheet();}
  if(d.qopen){if(qdirty&&!confirm("저장 안 된 변경이 있습니다. 다른 견적을 열까요?"))return;var q=quotes.find(function(x){return x.id===d.qopen;});if(q){quote=clone(q);qdirty=false;wr(K.draft,quote);$("overlay").hidden=true;renderQuote();}}
  if(d.qdel){if(confirm("이 견적서를 삭제할까요?")){quotes=quotes.filter(function(x){return x.id!==d.qdel;});wr(K.quotes,quotes);autoBackup();openQuoteList();setGlobalActions();}}
  if(d.qadv){var q2=quotes.find(function(x){return x.id===d.qadv;});if(q2){q2.status=Math.min(3,(q2.status||0)+1);wr(K.quotes,quotes);openQuoteList();}}
  if(d.qtax){var qt=quotes.find(function(x){return x.id===d.qtax;});if(qt)askTaxDate(qt);}
  if(t.id==="gLang2"){quote.lang=(quote.lang==="en"?"ko":"en");if(quote.lang==="en"){if(!quote.fxDate)quote.fxDate=todayISO();quote.vatRate=0;quote.manager=settings.managerEn||quote.manager;}else{quote.vatRate=10;quote.manager=settings.managerKo||quote.manager;}markQ();renderQuote();}
  if(d.qcert){var qc=quotes.find(function(x){return x.id===d.qcert;});if(qc)openCertChooser(qc);}
  if(d.certmake){var parts=d.certmake.split("|");var mq=quotes.find(function(x){return x.id===parts[0];});if(mq){var it=mq.items[+parts[1]];var pr=findProductByItem(it.name,it.spec);if(!pr){products.push(newProduct({name:it.name,spec:it.spec}));wr(K.products,products);pr=findProductByItem(it.name,it.spec);}cert=newCert(pr.id,mq.id);cdirty=true;$("overlay").hidden=true;view="cert";route();}}
  if(d.qissue){var q3=quotes.find(function(x){return x.id===d.qissue;});if(q3){var st=issueStatement(q3);$("overlay").hidden=true;alert("거래명세서를 발행했습니다. (일련번호 "+String(st.date).replace(/-/g,"/")+" -"+st.seq+")");view="statement";curStatement=st;route();}}
  if(d.paddBtn!==undefined||t.id==="paddBtn"){openProductEdit(null);}
  if(d.pedit){openProductEdit(d.pedit);}
  if(d.pdel){if(confirm("이 제품을 삭제할까요?")){products=products.filter(function(x){return x.id!==d.pdel;});wr(K.products,products);autoBackup();renderProductView();}}
  if(d.cert){cert=newCert(d.cert);cdirty=false;view="cert";route();}
  if(d.copen){var c=certs.find(function(x){return x.id===d.copen;});if(c){cert=clone(c);cdirty=false;renderCertView();}}
  if(d.sopen){curStatement=statements.find(function(x){return x.id===d.sopen;});renderStatementView();}
  if(d.sdel){if(confirm("이 거래명세서를 삭제할까요?")){var del=statements.find(function(x){return x.id===d.sdel;});statements=statements.filter(function(x){return x.id!==d.sdel;});if(del){var q=quotes.find(function(x){return x.id===del.quoteId;});if(q){q.status=3;q.statementId=null;wr(K.quotes,quotes);}}wr(K.statements,statements);autoBackup();curStatement=null;renderStatementView();}}
  if(t.id==="sprint"&&curStatement){printDoc(curStatement.date,"거래명세서",curStatement.recipient);}
  if(t.id==="sMail"){openMailDialog("statement");}
  if(t.id==="sdate"){}
});
document.addEventListener("change",function(e){
  if(e.target.id==="sdate"&&curStatement){curStatement.date=e.target.value;var i=statements.findIndex(function(x){return x.id===curStatement.id;});if(i>=0)statements[i].date=e.target.value;wr(K.statements,statements);ssheet();}
  if(e.target.dataset&&e.target.dataset.note!==undefined){if(!quote.noteFlags)quote.noteFlags=defaultNoteFlags();quote.noteFlags[+e.target.dataset.note]=e.target.checked;markQ();qsheet();}
  if(e.target.id==="usdManual"){quote.usdManual=e.target.checked;markQ();renderQuote();}
});

// 데스크톱: localStorage가 비었는데 자동백업 파일이 있으면 복구
function initApp(){
  var empty=(quotes.length===0&&products.length===0&&certs.length===0&&statements.length===0);
  if(isDesktop&&empty&&window.braumm.loadBackup){
    window.braumm.loadBackup().then(function(d){
      if(d&&(( d.quotes&&d.quotes.length)||(d.products&&d.products.length)||(d.certs&&d.certs.length)||(d.statements&&d.statements.length))){
        if(d.quotes)quotes=d.quotes;if(d.products)products=d.products;if(d.certs)certs=d.certs;if(d.statements)statements=d.statements;if(d.mailHistory)mailHistory=d.mailHistory;if(d.settings)settings=Object.assign(settings,d.settings);
        saveAll();
      }
      route();
    }).catch(function(){route();});
  } else {
    route();
  }
}
initApp();
})();
</script>
